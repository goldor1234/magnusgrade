<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <title>MarnusGrade — мини-приложение</title>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --surface: #151515;
      --surface-2: #202020;
      --line: #303030;
      --text: #f4f4f2;
      --muted: #999999;
      --light: #e8e8e6;
      --ink: #090909;
      --radius: 18px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--bg); }
    body { font-size: 14px; line-height: 1.4; }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--light); outline-offset: 3px;
    }
    .mock-tgbar {
      height: 48px; max-width: 390px; margin: 0 auto; display: grid;
      grid-template-columns: 44px 1fr 44px; align-items: center;
      border-bottom: 1px solid var(--line); text-align: center;
    }
    .mock-tgbar button { border: 0; background: none; color: var(--text); font-size: 21px; }
    .mock-tgbar strong { display: block; font-size: 16px; line-height: 17px; font-weight: 650; }
    .mock-tgbar small { display: block; color: var(--muted); font-size: 10px; }
    .app-shell {
      width: min(100%, 390px); min-height: calc(100dvh - 48px); margin: 0 auto;
      position: relative; padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    .brand-row {
      min-height: 56px; padding: 10px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { display: block; width: 40px; height: 40px; flex: 0 0 auto; object-fit: contain; }
    .brand-name { font-size: 20px; font-weight: 760; letter-spacing: -.4px; }
    .balance-pill {
      min-width: 132px; height: 36px; padding: 0 10px 0 13px; border: 1px solid var(--line);
      border-radius: 22px; background: var(--surface); display: flex; align-items: center;
      justify-content: space-between; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 650;
    }
    .balance-pill .plus { font-size: 21px; font-weight: 350; line-height: 1; }
    #screen { padding: 6px 20px 18px; }
    .page-head { position: relative; margin: 3px 0 17px; padding-right: 26px; }
    .page-head > .text-link { position: absolute; top: 0; right: 2px; font-size: 20px; line-height: 1.1; }
    .page-title { margin: 0; font-size: 28px; line-height: 1.13; font-weight: 780; letter-spacing: -.6px; }
    .page-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .section-heading { margin: 24px 0 13px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-heading h2 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 680; }
    .section-heading button, .text-link { padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; }
    .section-label { display: block; margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .hero {
      min-height: 176px; padding: 17px 18px; position: relative; overflow: hidden;
      border: 0; border-radius: 20px; background: var(--light); color: var(--ink);
    }
    .hero-eyebrow { color: #555; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .hero h2 { max-width: 215px; margin: 10px 0 0; font-size: 25px; line-height: 1.16; letter-spacing: -.7px; }
    .hero .hero-mark { position: absolute; right: 25px; top: 52px; width: 72px; height: 72px; object-fit: contain; filter: invert(1); }
    .hero .hero-caption { margin-top: 7px; color: #5b5b5b; font-size: 12px; }
    .hero .chip-light { display: inline-flex; margin-top: 6px; padding: 8px 25px; border-radius: 30px; background: #f7f7f5; font-size: 12px; }
    .hero-week { min-height: 167px; }
    .hero-week h2 { margin-top: 8px; font-size: 50px; line-height: 1; font-style: italic; }
    .hero-friends h2 { font-size: 51px; font-style: italic; }
    .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .game-card {
      min-height: 124px; padding: 12px 13px; position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
      text-align: left; cursor: pointer;
    }
    .game-card.light { background: #dededc; color: #0b0b0b; }
    .game-card .game-art { position: absolute; right: 8px; top: 0; color: #333; font-size: 55px; line-height: 1.1; font-weight: 850; }
    .game-card.light .game-art { color: #a8a8a5; }
    .game-card .game-name { position: absolute; left: 13px; bottom: 25px; font-size: 19px; font-weight: 700; }
    .game-card .game-desc { position: absolute; left: 13px; bottom: 9px; right: 8px; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-card.light .game-desc { color: #656565; }
    .wide-card, .info-card, .list-card, .metric-card, .input-box, .select-row, .progress-card {
      border: 1px solid var(--line); border-radius: 15px; background: var(--surface);
    }
    .wide-card { margin-top: 10px; padding: 12px 15px; display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; text-align: left; }
    .wide-card .title { font-size: 14px; }
    .wide-card .sub { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .arrow { font-size: 19px; }
    .recent-win { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .recent-win .name { font-size: 12px; }
    .recent-win small { display: block; color: var(--muted); font-size: 10px; }
    .minor-note { margin: 13px 0 0; color: var(--muted); text-align: center; font-size: 10px; }
    .search-box { height: 47px; margin: 14px 0 15px; padding: 0 13px; display: flex; align-items: center; gap: 11px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .search-box input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); }
    .search-box input::placeholder { color: var(--muted); }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill, .toggle-option {
      min-height: 35px; padding: 0 19px; border: 1px solid var(--line); border-radius: 24px;
      background: var(--surface); color: var(--muted); cursor: pointer; font-size: 12px;
    }
    .pill.selected, .toggle-option.selected { background: var(--light); border-color: var(--light); color: var(--ink); }
    .overline { margin: 28px 0 12px; color: #b0b0b0; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .games-page .game-card { min-height: 160px; }
    .games-page .game-card .game-name { bottom: 27px; }
    .feature-card { margin-top: 22px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .feature-card strong { font-size: 14px; font-weight: 550; }
    .feature-card p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .round-center { display: grid; place-items: center; margin: 11px 0 17px; }
    .dial { width: min(64vw, 230px); aspect-ratio: 1; position: relative; display: grid; place-items: center; }
    .dial svg { width: 100%; height: 100%; }
    .dial-track { fill: none; stroke: #202020; stroke-width: 7; }
    .dial-arc { fill: none; stroke: #f5f5f3; stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray .25s; }
    .dial-glow { fill: none; stroke: #777; stroke-width: 5; filter: blur(3px); }
    .dial-center { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; }
    .dial-center .dial-logo { width: 66px; height: 66px; object-fit: contain; }
    .dial-center strong { font-size: 36px; line-height: 1; }
    .dial-center small { margin-top: 6px; color: var(--muted); font-size: 10px; }
    .multiplier-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 20px; }
    .multiplier-row .pill { padding: 0 7px; }
    .input-box { min-height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 7px; }
    .input-box input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 18px; font-weight: 650; }
    .quick-inline { display: flex; gap: 15px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .quick-inline button { padding: 5px 0; border: 0; background: none; color: inherit; cursor: pointer; }
    .summary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; font-size: 12px; }
    .summary-row span:first-child { color: var(--muted); }
    .primary-btn, .secondary-btn {
      width: 100%; min-height: 51px; padding: 12px 16px; border: 0; border-radius: 30px;
      background: var(--light); color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 700;
    }
    .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .chart-card { height: 252px; margin: 15px 0 22px; padding: 15px; border: 1px solid var(--line); border-radius: 19px; background: var(--surface); }
    .chart-card .chart-label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .chart-card strong { display: block; margin-top: 14px; font-size: 54px; line-height: 1; font-style: italic; }
    .chart-card svg { width: 100%; height: 120px; margin-top: -2px; overflow: visible; }
    .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 21px 0; }
    .mine-cell { aspect-ratio: 1.13; border: 1px solid var(--line); border-radius: 12px; background: #171717; color: #555; cursor: pointer; font-size: 22px; }
    .mine-cell.safe { background: var(--light); color: var(--ink); }
    .mine-cell.open { border-color: #505050; }
    .metric-card { padding: 12px 15px; display: flex; justify-content: space-between; align-items: end; }
    .metric-card small { display: block; color: var(--muted); font-size: 10px; }
    .metric-card strong { font-size: 26px; line-height: 1.15; }
    .roulette-label { margin: 24px 0 4px; color: var(--muted); text-align: center; font-size: 10px; text-transform: uppercase; }
    .timer { margin: 0 0 16px; text-align: center; font-size: 42px; font-weight: 800; }
    .roulette-strip { height: 105px; padding: 12px 0; overflow: hidden; display: flex; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .roulette-strip span { min-width: 58px; display: grid; place-items: center; border-radius: 11px; background: #242424; font-size: 22px; font-weight: 700; }
    .roulette-strip span:nth-child(2), .roulette-strip span:nth-child(4) { background: var(--light); color: var(--ink); }
    .options-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .option-card { min-height: 66px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; text-align: left; }
    .option-card.selected { background: var(--light); color: var(--ink); }
    .option-card strong { display: block; font-size: 14px; }
    .option-card small { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .option-card.selected small { color: #666; }
    .light-card { padding: 17px 18px; border-radius: 20px; background: var(--light); color: var(--ink); }
    .light-card small { display: block; color: #5c5c5c; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .light-card .big-number { display: block; margin: 15px 0 10px; font-size: 42px; line-height: 1; font-weight: 800; }
    .light-card hr { height: 1px; margin: 13px 0; border: 0; background: #bdbdbb; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .split small { display: block; color: #666; font-size: 10px; }
    .split strong { display: block; margin-top: 3px; font-size: 19px; }
    .wallet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 28px; }
    .list-card { min-height: 65px; margin-top: 9px; padding: 10px 12px; display: flex; align-items: center; gap: 13px; }
    .list-icon { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; border-radius: 12px; background: #242424; font-size: 22px; }
    .list-copy { min-width: 0; flex: 1; }
    .list-copy strong { display: block; font-size: 13px; font-weight: 550; }
    .list-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .list-amount { font-size: 13px; font-weight: 650; white-space: nowrap; }
    .form-block { margin: 17px 0 0; }
    .form-help { margin: 7px 0 0; color: var(--muted); font-size: 10px; }
    .deposit-options { margin: 19px 0 25px; }
    .deposit-options .option-card { min-height: 80px; }
    .deposit-options .option-card strong { font-size: 18px; }
    .amount-presets { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
    .amount-presets .pill { min-width: 80px; padding: 0 12px; white-space: nowrap; }
    .check-card { margin: 23px 0; padding: 13px 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .check-card strong { font-size: 14px; }
    .check-card small { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .category-title { margin: 24px 0 10px; color: #b0b0b0; font-size: 10px; text-transform: uppercase; }
    .tabs { display: flex; gap: 8px; margin: 16px 0 22px; }
    .tabs .pill { flex: 1; padding: 0 7px; }
    .progress-card { margin-top: 15px; padding: 13px 15px; }
    .progress-card small { color: var(--muted); font-size: 10px; }
    .progress-card strong { display: block; margin-top: 4px; font-size: 26px; }
    .progress { height: 5px; margin-top: 12px; overflow: hidden; border-radius: 5px; background: #3a3a3a; }
    .progress span { display: block; width: 30%; height: 100%; border-radius: inherit; background: var(--light); }
    .code-input { width: 100%; min-height: 51px; margin-top: 19px; padding: 0 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); color: var(--text); }
    .code-input::placeholder { color: var(--muted); }
    .profile-card { margin: 18px 0 20px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .profile-card strong { display: block; font-size: 28px; }
    .profile-card small { display: block; margin: 6px 0; color: var(--muted); font-size: 11px; }
    .profile-card .verified { margin-top: 9px; font-size: 11px; }
    .faq { margin-top: 10px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .faq strong { font-size: 13px; font-weight: 550; }
    .faq p { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .toast {
      position: fixed; z-index: 5; left: 50%; bottom: calc(94px + env(safe-area-inset-bottom));
      width: min(calc(100% - 36px), 350px); padding: 12px 15px; border: 1px solid #484848;
      border-radius: 14px; background: #222; color: var(--text); text-align: center;
      opacity: 0; pointer-events: none; transform: translate(-50%, 10px); transition: .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .bottom-nav {
      position: fixed; z-index: 4; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100%, 390px); min-height: calc(82px + env(safe-area-inset-bottom));
      padding: 7px 8px calc(8px + env(safe-area-inset-bottom)); display: grid;
      grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line);
      background: rgba(8,8,8,.97); backdrop-filter: blur(12px);
    }
    .nav-item { border: 0; background: none; color: #8b8b8b; cursor: pointer; display: grid; justify-items: center; align-content: start; gap: 3px; }
    .nav-item .nav-icon { width: 47px; height: 35px; display: grid; place-items: center; border-radius: 22px; }
    .nav-item.active { color: var(--text); }
    .nav-item.active .nav-icon { background: #252525; }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item small { font-size: 10px; }
    .welcome { min-height: calc(100dvh - 72px); padding: 4px 0 25px; display: flex; flex-direction: column; }
    body.welcome-mode .app-shell { padding-bottom: 0; }
    .welcome-top { display: flex; justify-content: space-between; align-items: center; }
    .age-chip { padding: 6px 14px; border: 1px solid var(--line); border-radius: 20px; }
    .welcome h1 { margin: 24px 0 12px; font-size: 42px; line-height: 1.25; letter-spacing: -1px; }
    .welcome .lead { margin: 0; color: var(--muted); font-size: 14px; }
    .welcome .round-center { margin: auto 0 20px; }
    .welcome .dial { width: min(62vw, 242px); }
    .welcome .dial-center strong { font-size: 40px; font-style: italic; }
    .game-types { margin-bottom: 34px; color: #aaa; text-align: center; font-size: 10px; letter-spacing: .2px; }
    .welcome .primary-btn { margin-top: 6px; }
    .welcome .minor-note { margin-top: 18px; line-height: 1.5; }
    .welcome-footer { margin-top: auto; padding-top: 46px; color: #aaa; text-align: center; font-size: 10px; }
    .center-note { margin: 23px 10px 0; color: var(--muted); text-align: center; font-size: 11px; }
    .live-badge { display: none; margin: 0 20px 4px; padding: 5px 8px; border: 1px solid #383838; border-radius: 8px; color: #bdbdbd; font-size: 10px; text-align: center; }
    @media (min-width: 600px) {
      body { background: #111; }
      .mock-tgbar { margin-top: 18px; border: 1px solid var(--line); border-radius: 24px 24px 0 0; }
      .app-shell { min-height: calc(100dvh - 66px); border-inline: 1px solid #161616; }
      .bottom-nav { border-inline: 1px solid #161616; }
    }
    @media (max-width: 360px) {
      .brand-row, #screen { padding-inline: 15px; }
      .balance-pill { min-width: 121px; }
      .brand-name { font-size: 16px; }
      .game-card { min-height: 118px; padding-inline: 10px; }
      .game-card .game-name, .game-card .game-desc { left: 10px; }
      .page-title { font-size: 26px; }
      .quick-inline { gap: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="mock-tgbar" id="mockTgbar" aria-hidden="true">
    <button type="button" tabindex="-1">×</button>
    <div><strong>MarnusGrade</strong><small>мини-приложение</small></div>
    <button type="button" tabindex="-1">···</button>
  </div>
  <div class="app-shell">
    <header class="brand-row" id="brandRow">
      <div class="brand"><img class="brand-mark" src="./marnusgrade-mark.png" alt=""><span class="brand-name">MarnusGrade</span></div>
      <button class="balance-pill" type="button" data-route="deposit" aria-label="Пополнить баланс">
        <span id="headerBalance">12 450 ₽</span><span class="plus">＋</span>
      </button>
    </header>
    <div class="live-badge" id="demoBadge">Демо-просмотр · операции не выполняются</div>
    <main id="screen" aria-live="polite"></main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Основная навигация"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script defer src="./app.js?v=20261128-1"></script>
</body>
</html>
