<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Апгрейдер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1426;--panel:#261d38;--line:#3a2e55;--text:#f3eefc;--dim:#a99fc2;--win:#35e0a1;--lose:#ff5c7a;--gold:#ffc24b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.display{font-family:"Unbounded",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline}
header span{color:var(--dim)}
#bal{font-size:26px;font-weight:700;color:var(--gold)}
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:18px auto}
.dial svg{width:100%;height:100%}
.track{fill:none;stroke:var(--panel);stroke-width:22}
.arc{fill:none;stroke:var(--win);stroke-width:22;transition:stroke-dasharray .35s}
#needle{position:absolute;inset:0;transform-origin:50% 50%}
#needle::before{content:"";position:absolute;left:calc(50% - 4px);top:2%;width:8px;height:20%;border-radius:4px;background:var(--text)}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.center b{font-size:34px}
.center small{color:var(--dim)}
#msg{min-height:26px;text-align:center;font-weight:600}
.win{color:var(--win)}.lose{color:var(--lose)}
label{display:block;color:var(--dim);margin:14px 0 6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font-size:18px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mults{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mults button{padding:10px 4px;line-height:1.2}
.mults small{display:block;color:var(--dim)}
.mults button[aria-pressed=true]{border-color:var(--gold);background:#3a2b20}
#go{width:100%;margin-top:18px;padding:16px;font-size:18px;font-weight:700;background:var(--gold);color:#2a1a00;border:0}
#go:disabled{opacity:.5}
</style>
</head>
<body>
<main>
  <header><span>Баланс</span><div id="bal" class="display">…</div></header>

  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="80"/>
      <circle id="arc" class="arc" cx="100" cy="100" r="80" transform="rotate(-90 100 100)" stroke-dasharray="0 600"/>
    </svg>
    <div id="needle"></div>
    <div class="center"><b id="pay" class="display">–</b><small id="chance">шанс</small></div>
  </div>
  <div id="msg" role="status"></div>

  <label for="bet">Ставка</label>
  <div class="row">
    <input id="bet" type="number" inputmode="numeric" min="1" value="100">
    <button data-k="0.5">½</button><button data-k="2">×2</button><button data-k="max">Макс</button>
  </div>

  <label>Множитель</label>
  <div id="mults" class="mults"></div>

  <button id="go">Апгрейд</button>
</main>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 80;
let S = { balance: 0, multipliers: [], edge: .05, mult: 2, rot: 0, busy: false };

const chanceOf = m => Math.min(.95, (1 / m) * (1 - S.edge));
const haptic = t => tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t);

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Init-Data": tg.initData, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Ошибка сервера");
  return j;
}

function render() {
  $("bal").textContent = S.balance.toLocaleString("ru-RU") + " 💎";
  const c = chanceOf(S.mult);
  $("arc").setAttribute("stroke-dasharray", `${c * C} ${C}`);
  $("chance").textContent = `шанс ${(c * 100).toFixed(1)}%`;
  document.querySelectorAll("#mults button").forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.m === S.mult)));
}

function buildMults() {
  $("mults").innerHTML = "";
  S.multipliers.forEach(m => {
    const b = document.createElement("button");
    b.dataset.m = m;
    b.innerHTML = `×${m}<small>${(chanceOf(m) * 100).toFixed(1)}%</small>`;
    b.onclick = () => { if (!S.busy) { S.mult = m; $("pay").textContent = "–"; render(); } };
    $("mults").appendChild(b);
  });
}

document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
  const k = b.dataset.k, cur = +$("bet").value || 0;
  $("bet").value = k === "max" ? S.balance : Math.max(1, Math.floor(cur * +k));
});

function spin(win, chance) {
  // зелёная дуга занимает [0, chance*360] от верха; стрелка останавливается внутри нужной зоны
  const lo = win ? 0.06 * chance : chance + 0.04 * (1 - chance);
  const hi = win ? 0.94 * chance : 1 - 0.04 * (1 - chance);
  const target = (lo + Math.random() * (hi - lo)) * 360;
  const delta = 360 * 5 + ((target - (S.rot % 360)) + 360) % 360;
  S.rot += delta;
  const n = $("needle");
  n.style.transition = "transform 3.4s cubic-bezier(.12,.7,.1,1)";
  n.style.transform = `rotate(${S.rot}deg)`;
  return new Promise(res => setTimeout(res, 3500));
}

$("go").onclick = async () => {
  if (S.busy) return;
  const bet = Math.floor(+$("bet").value);
  if (!bet || bet < 1) { $("msg").textContent = "Введи ставку"; return; }
  if (bet > S.balance) { $("msg").textContent = "Недостаточно средств"; $("msg").className = "lose"; return; }
  S.busy = true; $("go").disabled = true; $("msg").textContent = ""; $("msg").className = "";
  try {
    const r = await api("/api/upgrade", { bet, mult: S.mult });
    await spin(r.win, r.chance);
    S.balance = r.balance;
    $("pay").textContent = r.win ? "+" + r.payout : "−" + bet;
    $("msg").textContent = r.win ? "Успех! Ставка умножена" : "Не повезло. Ставка сгорела";
    $("msg").className = r.win ? "win" : "lose";
    haptic(r.win ? "success" : "error");
  } catch (e) {
    $("msg").textContent = e.message; $("msg").className = "lose";
  } finally {
    S.busy = false; $("go").disabled = false; render();
  }
};

(async () => {
  try {
    const me = await api("/api/me");
    Object.assign(S, { balance: me.balance, multipliers: me.multipliers, edge: me.edge });
    if (me.banned) { $("go").disabled = true; $("msg").textContent = "Аккаунт заблокирован"; }
    if (!S.multipliers.includes(S.mult)) S.mult = S.multipliers[0];
    buildMults(); render();
  } catch (e) {
    $("msg").textContent = "Открой приложение через бота в Telegram"; $("msg").className = "lose";
  }
})();
</script>
</body>
</html>
