<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15111d">
  <meta name="color-scheme" content="dark">
  <title>MagnusGrade — апгрейдер</title>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #15111d;
      --surface: #201a2b;
      --surface-raised: #2a2238;
      --line: #3d334f;
      --text: #f7f3fc;
      --muted: #b9afc9;
      --gold: #f5c968;
      --gold-deep: #3c3020;
      --green: #66d6a5;
      --red: #ff8290;
      --radius: 18px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: radial-gradient(ellipse at 50% -10%, #2e2340 0, var(--bg) 52%);
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }
    .shell {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #796340;
      border-radius: 14px;
      background: linear-gradient(145deg, #3a2d21, #292136);
      color: var(--gold);
      font-size: 22px;
      font-weight: 800;
    }
    .brand-name { margin: 0; font-size: 18px; line-height: 1.15; letter-spacing: .01em; }
    .brand-caption { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .balance {
      min-width: 106px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(32, 26, 43, .85);
      text-align: right;
    }
    .balance-label { display: block; color: var(--muted); font-size: 12px; }
    .balance-value { display: block; margin-top: 1px; color: var(--gold); font-size: 17px; font-weight: 750; white-space: nowrap; }
    .game-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(42, 34, 56, .98), rgba(31, 25, 42, .98));
      box-shadow: 0 14px 36px rgba(0, 0, 0, .18);
    }
    .dial-wrap { display: grid; place-items: center; padding: 2px 0 12px; }
    .dial {
      position: relative;
      width: min(66vw, 264px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    .dial svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .dial-track { fill: none; stroke: #3a3049; stroke-width: 12; }
    .dial-arc {
      fill: none;
      stroke: var(--gold);
      stroke-width: 12;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dasharray 220ms ease;
    }
    .needle {
      position: absolute;
      top: 9%;
      left: calc(50% - 2px);
      width: 4px;
      height: 42%;
      border-radius: 6px;
      background: linear-gradient(var(--text) 0 75%, transparent 100%);
      transform: rotate(0deg);
      transform-origin: 50% 98%;
      transition: transform 2.5s cubic-bezier(.12,.72,.12,1);
      filter: drop-shadow(0 1px 4px rgba(0,0,0,.35));
    }
    .dial-center {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      pointer-events: none;
      text-align: center;
    }
    .chance-label { color: var(--muted); font-size: 13px; }
    .chance-value { margin-top: 2px; font-size: clamp(35px, 10vw, 46px); font-weight: 800; letter-spacing: -.045em; line-height: 1.05; }
    .mult-label { margin-top: 5px; color: var(--gold); font-size: 15px; font-weight: 700; }
    .status {
      min-height: 48px;
      display: grid;
      place-items: center;
      margin: 0 0 16px;
      padding: 10px 13px;
      border: 1px solid #4b3c5c;
      border-radius: 13px;
      background: rgba(17, 14, 23, .45);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    .status.success { border-color: #3a775e; color: var(--green); }
    .status.error { border-color: #77414a; color: var(--red); }
    .status a { color: var(--gold); font-weight: 700; text-underline-offset: 3px; }
    .section-label { display: block; margin: 0 0 8px; color: var(--muted); font-size: 14px; font-weight: 650; }
    .bet-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .bet-input {
      width: 100%;
      min-height: 50px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #17131e;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }
    .quick-actions { display: flex; gap: 7px; }
    .button {
      min-height: 46px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-raised);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }
    .button:hover:not(:disabled) { border-color: #76618f; background: #352b47; }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button:disabled { cursor: not-allowed; opacity: .55; }
    .quick-actions .button { min-width: 48px; padding-inline: 10px; font-weight: 700; }
    .multiplier-block { margin-top: 17px; }
    .multipliers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .multiplier {
      min-height: 54px;
      padding: 7px 5px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #211b2c;
      cursor: pointer;
      text-align: center;
    }
    .multiplier[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-deep); box-shadow: inset 0 0 0 1px rgba(245, 201, 104, .2); }
    .multiplier:disabled { cursor: not-allowed; opacity: .55; }
    .multiplier strong { display: block; font-size: 16px; }
    .multiplier small { display: block; margin-top: 1px; color: var(--muted); font-size: 12px; }
    .play-button {
      width: 100%;
      min-height: 56px;
      margin-top: 17px;
      border: 0;
      border-radius: 14px;
      background: var(--gold);
      color: #261b0c;
      cursor: pointer;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(245, 201, 104, .14);
      transition: filter 140ms ease, transform 140ms ease;
    }
    .play-button:hover:not(:disabled) { filter: brightness(1.06); }
    .play-button:active:not(:disabled) { transform: translateY(1px); }
    .play-button:disabled { cursor: not-allowed; opacity: .58; box-shadow: none; }
    .footnote { margin: 15px 0 0; color: #a89eb7; text-align: center; font-size: 12px; }
    .last-result { min-height: 22px; margin: 10px 0 0; color: var(--muted); text-align: center; font-size: 14px; font-weight: 650; }
    .last-result.win { color: var(--green); }
    .last-result.loss { color: var(--red); }
    @media (min-width: 600px) {
      .shell { padding-top: 28px; padding-bottom: 20px; }
      .game-card { padding: 24px; }
    }
    @media (max-width: 600px) {
      .shell { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .topbar { margin-bottom: 14px; }
      .game-card { padding: 18px; }
      .dial { width: min(58vw, 240px); }
      .dial-wrap { padding-bottom: 8px; }
    }
    @media (max-width: 370px) {
      .shell { padding-inline: 14px; }
      .game-card { padding: 16px; }
      .quick-actions { gap: 5px; }
      .quick-actions .button { min-width: 43px; padding-inline: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="MagnusGrade">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <h1 class="brand-name">MagnusGrade</h1>
          <p class="brand-caption">Апгрейдер</p>
        </div>
      </div>
      <div class="balance" aria-live="polite">
        <span class="balance-label">Баланс</span>
        <strong class="balance-value" id="balance">— 💎</strong>
      </div>
    </header>
​
    <section class="game-card" aria-label="Игра на апгрейд">
      <div class="dial-wrap">
        <div class="dial" aria-label="Шанс выигрыша">
          <svg viewBox="0 0 220 220" aria-hidden="true">
            <circle class="dial-track" cx="110" cy="110" r="83"></circle>
            <circle class="dial-arc" id="chanceArc" cx="110" cy="110" r="83" stroke-dasharray="0 521.5"></circle>
          </svg>
          <div class="needle" id="needle" aria-hidden="true"></div>
          <div class="dial-center">
            <span class="chance-label">Шанс выигрыша</span>
            <strong class="chance-value" id="chanceValue">—%</strong>
            <span class="mult-label" id="multLabel">Множитель ×—</span>
          </div>
        </div>
      </div>
​
      <p class="status" id="status" role="status" aria-live="polite">Подключаем приложение…</p>
​
      <label class="section-label" for="bet">Ставка</label>
      <div class="bet-row">
        <input class="bet-input" id="bet" type="number" inputmode="numeric" min="1" step="1" value="1" aria-describedby="betHelp" disabled>
        <div class="quick-actions" aria-label="Быстрый выбор ставки">
          <button class="button" type="button" data-bet="half" aria-label="Половина текущей ставки" disabled>½</button>
          <button class="button" type="button" data-bet="double" aria-label="Удвоить ставку" disabled>×2</button>
          <button class="button" type="button" data-bet="max" aria-label="Поставить весь баланс" disabled>Макс</button>
        </div>
      </div>
      <span id="betHelp" class="footnote" style="display:block;margin-top:7px">Выбери сумму, затем множитель</span>
​
      <div class="multiplier-block">
        <span class="section-label">Множитель</span>
        <div class="multipliers" id="multipliers" role="group" aria-label="Выбор множителя">
          <button class="multiplier" type="button" disabled><strong>×—</strong><small>—%</small></button>
          <button class="multiplier" type="button" disabled><strong>×—</strong><small>—%</small></button>
          <button class="multiplier" type="button" disabled><strong>×—</strong><small>—%</small></button>
        </div>
      </div>
​
      <button class="play-button" id="play" type="button" disabled>Апгрейд</button>
      <p class="last-result" id="lastResult" aria-live="polite"></p>
      <p class="footnote">Результат рассчитывается на сервере</p>
    </section>
  </main>
​
  <script>
    (() => {
      let tg = null;
      const $ = (id) => document.getElementById(id);
      const pause = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
      async function waitForTelegram() {
        const deadline = Date.now() + 8000;
        while (Date.now() < deadline) {
          if (window.Telegram && window.Telegram.WebApp) return window.Telegram.WebApp;
          await pause(120);
        }
        return null;
      }
      function addOpenBotLink(message, kind) {
        setStatus(message, kind || "");
        const link = document.createElement("a");
        link.href = "https://t.me/magnusgrade_bot";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Открыть бота";
        status.append(document.createElement("br"), link);
      }
      const circumference = 2 * Math.PI * 83;
      const state = { balance: 0, multipliers: [], edge: 0.05, minBet: 1, mult: 2, busy: false, banned: false, rotation: 0 };
      const betInput = $("bet");
      const playButton = $("play");
      const status = $("status");
      const result = $("lastResult");
      const amount = (value) => Math.max(0, Math.floor(Number(value) || 0)).toLocaleString("ru-RU");
      const chanceFor = (mult) => Math.min(0.95, (1 / Number(mult)) * (1 - state.edge));
​
      function setStatus(text, kind) {
        status.textContent = text;
        status.className = "status" + (kind ? " " + kind : "");
      }
​
      function renderDial() {
        const chance = chanceFor(state.mult);
        $("chanceArc").setAttribute("stroke-dasharray", `${chance * circumference} ${circumference}`);
        $("chanceValue").textContent = `${(chance * 100).toFixed(1)}%`;
        $("multLabel").textContent = `Множитель ×${state.mult}`;
      }
​
      function setControlsEnabled(enabled) {
        const disabled = !enabled || state.busy || state.banned;
        betInput.disabled = disabled;
        playButton.disabled = disabled;
        document.querySelectorAll("[data-bet]").forEach((button) => { button.disabled = disabled; });
        document.querySelectorAll(".multiplier").forEach((button) => { button.disabled = disabled; });
      }
​
      function renderMultipliers() {
        const root = $("multipliers");
        root.replaceChildren();
        state.multipliers.forEach((value) => {
          const mult = Number(value);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "multiplier";
          button.setAttribute("aria-pressed", String(mult === state.mult));
          const title = document.createElement("strong");
          title.textContent = `×${mult}`;
          const sub = document.createElement("small");
          sub.textContent = `${(chanceFor(mult) * 100).toFixed(1)}% шанс`;
          button.append(title, sub);
          button.addEventListener("click", () => {
            if (state.busy || state.banned) return;
            state.mult = mult;
            renderMultipliers();
            renderDial();
            result.textContent = "";
            result.className = "last-result";
          });
          root.appendChild(button);
        });
      }
​
      function renderBalance() {
        $("balance").textContent = `${amount(state.balance)} 💎`;
        betInput.max = String(state.balance);
      }
​
      async function request(path, body) {
        const response = await fetch(path, {
          method: body ? "POST" : "GET",
          headers: {
            "X-Init-Data": tg && tg.initData ? tg.initData : "",
            "Content-Type": "application/json"
          },
          body: body ? JSON.stringify(body) : undefined
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Ошибка сервера (${response.status})`);
        return data;
      }
​
      function formatError(error) {
        if (error && error.message === "Failed to fetch") return "Не удалось связаться с сервером. Попробуй ещё раз.";
        return error && error.message ? error.message : "Не удалось выполнить запрос.";
      }
​
      function spin(win, chance) {
        const pointer = $("needle");
        const position = win ? Math.random() * chance : chance + Math.random() * (1 - chance);
        const target = position * 360;
        const delta = 360 * 5 + ((target - (state.rotation % 360)) + 360) % 360;
        state.rotation += delta;
        pointer.style.transform = `rotate(${state.rotation}deg)`;
        const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        return new Promise((resolve) => window.setTimeout(resolve, reduced ? 30 : 2600));
      }
​
      document.querySelectorAll("[data-bet]").forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.bet;
          const current = Math.max(state.minBet, Math.floor(Number(betInput.value) || state.minBet));
          let next = current;
          if (mode === "half") next = Math.floor(current / 2);
          if (mode === "double") next = current * 2;
          if (mode === "max") next = state.balance;
          next = Math.max(state.minBet, Math.min(state.balance, next));
          betInput.value = String(next || state.minBet);
        });
      });
​
      playButton.addEventListener("click", async () => {
        if (state.busy || state.banned) return;
        const bet = Math.floor(Number(betInput.value));
        if (!Number.isFinite(bet) || bet < state.minBet) {
          setStatus(`Минимальная ставка — ${amount(state.minBet)} 💎`, "error");
          return;
        }
        if (bet > state.balance) {
          setStatus("Ставка больше текущего баланса", "error");
          return;
        }
​
        state.busy = true;
        setControlsEnabled(true);
        result.textContent = "";
        result.className = "last-result";
        setStatus("Проверяем ставку…", "");
        try {
          const game = await request("/api/upgrade", { bet, mult: state.mult });
          await spin(Boolean(game.win), Number(game.chance));
          state.balance = Number(game.balance);
          renderBalance();
          if (game.win) {
            result.textContent = `Выигрыш: +${amount(game.payout)} 💎`;
            result.className = "last-result win";
            setStatus("Успешный апгрейд", "success");
            try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
          } else {
            result.textContent = `Ставка потеряна: −${amount(bet)} 💎`;
            result.className = "last-result loss";
            setStatus("В этот раз не повезло", "error");
            try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error"); } catch (_) {}
          }
          betInput.value = String(Math.min(Math.max(state.minBet, bet), state.balance || state.minBet));
        } catch (error) {
          setStatus(formatError(error), "error");
        } finally {
          state.busy = false;
          setControlsEnabled(true);
        }
      });
​
      async function init() {
        tg = await waitForTelegram();
        if (!tg) {
          addOpenBotLink("Telegram SDK не загрузился. Проверь соединение и открой приложение через бота.", "error");
          return;
        }
        try { tg.ready(); tg.expand(); } catch (_) {}
        if (!tg.initData) {
          addOpenBotLink("Открой приложение через Telegram, чтобы загрузить профиль.");
          return;
        }
        try {
          const profile = await request("/api/me");
          state.balance = Number(profile.balance) || 0;
          state.multipliers = Array.isArray(profile.multipliers) ? profile.multipliers.map(Number) : [];
          state.edge = Number.isFinite(Number(profile.edge)) ? Number(profile.edge) : 0.05;
          state.minBet = Math.max(1, Number(profile.min_bet) || 1);
          state.banned = Boolean(profile.banned);
          if (!state.multipliers.includes(state.mult)) state.mult = state.multipliers[0] || 2;
          betInput.min = String(state.minBet);
          betInput.value = String(state.minBet);
          renderBalance();
          renderMultipliers();
          renderDial();
          setControlsEnabled(true);
          if (state.banned) {
            setStatus("Аккаунт заблокирован", "error");
          } else {
            setStatus("Выбери ставку и множитель", "");
          }
        } catch (error) {
          setStatus(formatError(error), "error");
        }
      }
​
      renderDial();
      init();
    })();
  </script>
</body>
</html>
​
